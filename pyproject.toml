[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "complaint-intelligence-lab"
version = "0.1.0"
description = "Complaint categorisation and review routing on the CFPB schema with a TF-IDF baseline, abstention thresholds and chronology-aware evaluation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Md Sultanul Arefin Sourav" }]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
fetch = ["requests>=2.31"]
test = ["pytest>=7"]

[project.scripts]
complaint-intelligence-lab = "complaint_intelligence_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
